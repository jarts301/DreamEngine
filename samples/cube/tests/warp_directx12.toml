# The Direct3D 12 check on WARP, Windows' software rasterizer, so build servers without a GPU
# compare the picture too. CTest runs it.
[app]
title = "Screenshot Check"
width = 960
height = 540

[cube]
spin = false
quit_after_frames = 900

[input.actions]
toggle_spin = ["key:space"]
quit = ["key:escape"]


[rhi.directx12]
software = true
debug = false

# Compares frame 60 with the reference image, within a tolerance. See docs/adr/0021.
[screenshot]
frame = 60
save = "cube_warp12_screenshot.png"
reference = "assets:/screenshots/cube.png"
tolerance = 24
max_differing = 0.01
quit = true

# Only built on Windows, so only its table is listed.
[modules.windows]
platform = ["sdl3"]
rhi = ["directx12"]
