[app]
window = "hidden"
title = "Dream Cube Direct3D 12 Check"
width = 960
height = 540

[cube]
spin = false
quit_after_frames = 900

[rhi.directx12]
debug = true

[input.actions]
toggle_spin = ["key:space"]
quit = ["key:escape"]

# Compares frame 60 with the reference image, within a tolerance. See docs/adr/0021.
[screenshot]
frame = 60
save = "cube_directx12_screenshot.png"
reference = "assets:/screenshots/cube.png"
tolerance = 24
max_differing = 0.01
quit = false

# Only built on Windows, so only its table is listed.
[modules.windows]
platform = ["sdl3"]
input_device = ["null"]
rhi = ["directx12"]

[audio]
muted = true
