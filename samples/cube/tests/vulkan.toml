[app]
title = "Dream Cube Check"
width = 960
height = 540

[cube]
spin = false
quit_after_frames = 900

[rhi.vulkan]
validation = true

[input.actions]
toggle_spin = ["key:space"]
quit = ["key:escape"]

# Compares frame 60 with the reference image, within a tolerance. See docs/adr/0021.
[screenshot]
frame = 60
save = "cube_vulkan_screenshot.png"
reference = "assets:/screenshots/cube.png"
tolerance = 24
max_differing = 0.01
quit = false

[modules.windows]
platform = ["sdl3"]
rhi = ["vulkan"]

[modules.android]
platform = ["sdl3"]
rhi = ["vulkan"]

[modules.linux]
platform = ["sdl3"]
rhi = ["vulkan"]
