[app]
title = "Dream Cube Check"
width = 960
height = 540

[cube]
spin = false
quit_after_frames = 900

[rhi.vulkan]
validation = true

[input.actions]
toggle_spin = ["key:space"]
quit = ["key:escape"]

[modules.windows]
platform = ["sdl3"]
rhi = ["vulkan"]

[modules.android]
platform = ["sdl3"]
rhi = ["vulkan"]

[modules.linux]
platform = ["sdl3"]
rhi = ["vulkan"]
