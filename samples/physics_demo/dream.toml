[app]
organization = "DreamEngine"
name = "DreamPhysics"
title = "Dream Physics"
width = 1280
height = 720

[demo]
mode = "3d"           # Or "2d".
show_shapes = false

[input.actions]
shoot = ["key:space", "mouse:left", "touch"]
switch = ["key:tab", "gamepad:north"]
shapes = ["key:d", "gamepad:west"]
quit = ["key:escape", "gamepad:back"]

[modules.windows]
platform = ["sdl3"]
input_device = ["sdl3_gamepad", "null"]
rhi = ["vulkan", "directx12", "directx", "opengl", "opengles", "null"]
renderer = ["forward", "null"]
mesh_simplifier = ["meshoptimizer", "null"]
tangent_generator = ["mikktspace", "null"]
animation = ["ozz", "null"]
physics3d = ["jolt", "impulse"]
physics2d = ["box2d", "chipmunk"]
texture_decoder = ["ktx", "null"]

[modules.android]
platform = ["sdl3"]
input_device = ["sdl3_gamepad", "null"]
rhi = ["vulkan", "opengles", "null"]
renderer = ["forward", "null"]
mesh_simplifier = ["meshoptimizer", "null"]
tangent_generator = ["mikktspace", "null"]
animation = ["ozz", "null"]
physics3d = ["jolt"]
physics2d = ["box2d"]
texture_decoder = ["ktx", "null"]

[modules.linux]
platform = ["sdl3"]
input_device = ["sdl3_gamepad", "null"]
rhi = ["vulkan", "null"]
renderer = ["forward", "null"]
mesh_simplifier = ["meshoptimizer", "null"]
tangent_generator = ["mikktspace", "null"]
animation = ["ozz", "null"]
physics3d = ["jolt"]
physics2d = ["box2d"]
texture_decoder = ["ktx", "null"]
