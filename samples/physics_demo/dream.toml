[app]
organization = "DreamEngine"
name = "DreamPhysics"
title = "Dream Physics"
# Drawn on the CPU (ADR 0039), so a smaller picture and a frame-rate cap keep it smooth and
# leave the machine some room.
width = 960
height = 540
max_fps = 30

[demo]
mode = "3d"           # Or "2d".
show_shapes = false

[input.actions]
shoot = ["key:space", "mouse:left", "touch"]
switch = ["key:tab", "gamepad:north"]
shapes = ["key:d", "gamepad:west"]
quit = ["key:escape", "gamepad:back"]

# The web platform shows the game in a browser, drawn on the CPU by the software renderer
# (ADR 0039). Open the address it logs, or start it from the hub.
[modules.linux]
platform = ["web"]
input_device = ["null"]
rhi = ["software"]
renderer = ["software"]
mesh_simplifier = ["meshoptimizer", "null"]
tangent_generator = ["mikktspace", "null"]
animation = ["ozz", "null"]
physics3d = ["impulse"]
physics2d = ["box2d"]
