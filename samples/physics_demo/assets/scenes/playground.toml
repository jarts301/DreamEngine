# A 3D playground for Physics3D: a pyramid of crates, bouncy balls, a pendulum, a swinging gate,
# a kinematic paddle and a sensor zone. Crate and ball models are 2 m across, so their scale is
# their half size.

[entities.camera.transform]
position = [0.0, 7.0, 17.0]

[entities.camera.camera]
vertical_fov = 50.0
target = [0.0, 2.0, 0.0]

[entities.sun.directional_light]
direction = [-0.5, -1.0, -0.6]
color = [1.0, 0.95, 0.85]
intensity = 1.3
ambient = 0.3

# The floor's top is at y = 0. Its model is a child, because the body sits half a meter lower.
[entities.ground.transform]
position = [0.0, -0.5, 0.0]

[entities.ground.rigid_body]
motion = "static"
half_extents = [12.0, 0.5, 12.0]
friction = 0.8

[entities.ground_surface]
parent = "ground"

[entities.ground_surface.transform]
position = [0.0, 0.5, 0.0]
scale = [12.0, 1.0, 12.0]

[entities.ground_surface.mesh]
model = "assets:/models/ground.glb"

# A pyramid of ten crates, 1 m each.
[entities.crate_1.transform]
position = [-1.5, 0.5, 0.0]
scale = [0.5, 0.5, 0.5]
[entities.crate_1.mesh]
model = "assets:/models/crate.glb"
[entities.crate_1.rigid_body]
mass = 4.0

[entities.crate_2.transform]
position = [-0.5, 0.5, 0.0]
scale = [0.5, 0.5, 0.5]
[entities.crate_2.mesh]
model = "assets:/models/crate.glb"
[entities.crate_2.rigid_body]
mass = 4.0

[entities.crate_3.transform]
position = [0.5, 0.5, 0.0]
scale = [0.5, 0.5, 0.5]
[entities.crate_3.mesh]
model = "assets:/models/crate.glb"
[entities.crate_3.rigid_body]
mass = 4.0

[entities.crate_4.transform]
position = [1.5, 0.5, 0.0]
scale = [0.5, 0.5, 0.5]
[entities.crate_4.mesh]
model = "assets:/models/crate.glb"
[entities.crate_4.rigid_body]
mass = 4.0

[entities.crate_5.transform]
position = [-1.0, 1.5, 0.0]
scale = [0.5, 0.5, 0.5]
[entities.crate_5.mesh]
model = "assets:/models/crate.glb"
[entities.crate_5.rigid_body]
mass = 4.0

[entities.crate_6.transform]
position = [0.0, 1.5, 0.0]
scale = [0.5, 0.5, 0.5]
[entities.crate_6.mesh]
model = "assets:/models/crate.glb"
[entities.crate_6.rigid_body]
mass = 4.0

[entities.crate_7.transform]
position = [1.0, 1.5, 0.0]
scale = [0.5, 0.5, 0.5]
[entities.crate_7.mesh]
model = "assets:/models/crate.glb"
[entities.crate_7.rigid_body]
mass = 4.0

[entities.crate_8.transform]
position = [-0.5, 2.5, 0.0]
scale = [0.5, 0.5, 0.5]
[entities.crate_8.mesh]
model = "assets:/models/crate.glb"
[entities.crate_8.rigid_body]
mass = 4.0

[entities.crate_9.transform]
position = [0.5, 2.5, 0.0]
scale = [0.5, 0.5, 0.5]
[entities.crate_9.mesh]
model = "assets:/models/crate.glb"
[entities.crate_9.rigid_body]
mass = 4.0

[entities.crate_top.transform]
position = [0.0, 3.5, 0.0]
scale = [0.5, 0.5, 0.5]
[entities.crate_top.mesh]
model = "assets:/models/crate.glb"
tint = [0.75, 0.9, 1.0]
[entities.crate_top.rigid_body]
mass = 4.0

# Balls that bounce differently.
[entities.ball_red.transform]
position = [-5.0, 4.0, 2.0]
scale = [0.6, 0.6, 0.6]
[entities.ball_red.mesh]
model = "assets:/models/ball.glb"
tint = [0.85, 0.12, 0.10]
[entities.ball_red.rigid_body]
shape = "sphere"
radius = 0.6
restitution = 0.8

[entities.ball_green.transform]
position = [-3.5, 6.0, 3.0]
scale = [0.45, 0.45, 0.45]
[entities.ball_green.mesh]
model = "assets:/models/ball.glb"
tint = [0.12, 0.70, 0.20]
[entities.ball_green.rigid_body]
shape = "sphere"
radius = 0.45
restitution = 0.3

# A pendulum hanging 3 m below a point in the world, set swinging.
[entities.pendulum.transform]
position = [-7.0, 2.5, -2.0]
scale = [0.5, 0.5, 0.5]
[entities.pendulum.mesh]
model = "assets:/models/ball.glb"
tint = [0.95, 0.75, 0.15]
[entities.pendulum.rigid_body]
shape = "sphere"
radius = 0.5
mass = 3.0
velocity = [0.0, 0.0, 5.0]
linear_damping = 0.0
angular_damping = 0.0
[entities.pendulum.joint]
type = "point"
anchor = [0.0, 3.0, 0.0]

# A gate hinged on its left edge, which can swing a quarter turn either way.
[entities.gate.transform]
position = [5.5, 1.05, 3.0]
scale = [1.0, 1.0, 0.1]
[entities.gate.mesh]
model = "assets:/models/crate.glb"
tint = [0.6, 0.45, 0.35]
[entities.gate.rigid_body]
half_extents = [1.0, 1.0, 0.1]
mass = 6.0
[entities.gate.joint]
type = "hinge"
anchor = [-1.0, 0.0, 0.0]
axis = [0.0, 1.0, 0.0]
min_angle = -90.0
max_angle = 90.0

# A paddle the game turns, which sweeps anything in its way.
[entities.paddle.transform]
position = [5.0, 0.35, -3.5]
scale = [2.5, 0.3, 0.3]
[entities.paddle.mesh]
model = "assets:/models/crate.glb"
tint = [0.3, 0.5, 1.0]
[entities.paddle.rigid_body]
motion = "kinematic"
half_extents = [2.5, 0.3, 0.3]
[entities.paddle.spin]
speed = 1.5

[entities.paddle_ball.transform]
position = [6.5, 0.5, -3.5]
scale = [0.5, 0.5, 0.5]
[entities.paddle_ball.mesh]
model = "assets:/models/ball.glb"
tint = [0.9, 0.9, 0.9]
[entities.paddle_ball.rigid_body]
shape = "sphere"
radius = 0.5

# A sensor in front of the pyramid. The game counts what passes through it; turn on debug drawing
# to see it.
[entities.zone.transform]
position = [0.0, 1.5, 5.0]
[entities.zone.rigid_body]
motion = "static"
half_extents = [2.0, 1.5, 1.5]
sensor = true
