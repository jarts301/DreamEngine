# A 2D scene for Physics2D, drawn by the 3D renderer looking straight at the XY plane: a stack of
# boxes, a seesaw, a pendulum, a bridge post and a sloped ramp.

[entities.camera.transform]
position = [0.0, 4.5, 20.0]

[entities.camera.camera]
vertical_fov = 45.0
target = [0.0, 4.5, 0.0]

[entities.sun.directional_light]
direction = [-0.3, -0.6, -1.0]
color = [1.0, 0.97, 0.9]
intensity = 1.2
ambient = 0.35

# The floor's top is at y = 0.
[entities.floor.transform]
position = [0.0, -0.5, 0.0]
scale = [12.0, 0.5, 1.0]
[entities.floor.mesh]
model = "assets:/models/crate.glb"
tint = [0.55, 0.6, 0.55]
[entities.floor.rigid_body_2d]
motion = "static"
half_extents = [12.0, 0.5]
friction = 0.8

# A stack of three boxes.
[entities.box_1.transform]
position = [-5.0, 0.5, 0.0]
scale = [0.5, 0.5, 0.5]
[entities.box_1.mesh]
model = "assets:/models/crate.glb"
[entities.box_1.rigid_body_2d]

[entities.box_2.transform]
position = [-5.0, 1.5, 0.0]
scale = [0.5, 0.5, 0.5]
[entities.box_2.mesh]
model = "assets:/models/crate.glb"
[entities.box_2.rigid_body_2d]

[entities.box_3.transform]
position = [-5.0, 2.5, 0.0]
scale = [0.5, 0.5, 0.5]
[entities.box_3.mesh]
model = "assets:/models/crate.glb"
tint = [0.75, 0.9, 1.0]
[entities.box_3.rigid_body_2d]

# A seesaw: a plank on a hinge at its middle, which can tilt 25 degrees each way.
[entities.pivot.transform]
position = [4.0, 0.6, 0.0]
scale = [0.3, 0.6, 0.3]
[entities.pivot.mesh]
model = "assets:/models/crate.glb"
tint = [0.4, 0.4, 0.45]

[entities.plank.transform]
position = [4.0, 1.35, 0.0]
scale = [3.0, 0.15, 0.4]
[entities.plank.mesh]
model = "assets:/models/crate.glb"
tint = [0.8, 0.6, 0.4]
[entities.plank.rigid_body_2d]
half_extents = [3.0, 0.15]
mass = 3.0
[entities.plank.joint_2d]
type = "hinge"
min_angle = -25.0
max_angle = 25.0

# A pendulum on a rope from a point in the air, which may go slack but never longer than 3 m.
[entities.bob.transform]
position = [-1.0, 7.5, 0.0]
scale = [0.4, 0.4, 0.4]
[entities.bob.mesh]
model = "assets:/models/ball.glb"
tint = [0.95, 0.75, 0.15]
[entities.bob.rigid_body_2d]
shape = "circle"
radius = 0.4
velocity = [4.0, 0.0]
[entities.bob.joint_2d]
type = "distance"
connected_anchor = [-1.0, 10.5]
max_distance = 3.0

# A ramp, turned 20 degrees, that sends drops to the left.
[entities.ramp.transform]
position = [8.5, 4.0, 0.0]
rotation = [0.0, 0.0, 20.0]
scale = [2.0, 0.15, 0.5]
[entities.ramp.mesh]
model = "assets:/models/crate.glb"
tint = [0.4, 0.5, 0.8]
[entities.ramp.rigid_body_2d]
motion = "static"
half_extents = [2.0, 0.15]

[entities.wheel.transform]
position = [9.5, 5.5, 0.0]
scale = [0.5, 0.5, 0.5]
[entities.wheel.mesh]
model = "assets:/models/ball.glb"
tint = [0.85, 0.12, 0.10]
[entities.wheel.rigid_body_2d]
shape = "circle"
radius = 0.5
restitution = 0.4
