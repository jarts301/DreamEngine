# The scripted run on the real GPU, with Vulkan validation.
[app]
window = "hidden"
title = "Dream Physics Check"
width = 960
height = 540
fixed_rate = 120

[demo]
scripted = true

[rhi.vulkan]
validation = true

[input.actions]
shoot = ["key:space"]
switch = ["key:tab"]
shapes = ["key:d"]
quit = ["key:escape"]

[modules.windows]
platform = ["sdl3"]
input_device = ["null"]
rhi = ["vulkan"]
renderer = ["forward"]
mesh_simplifier = ["meshoptimizer"]
tangent_generator = ["mikktspace"]
animation = ["ozz"]
physics3d = ["jolt"]
physics2d = ["box2d"]

[modules.android]
platform = ["sdl3"]
input_device = ["null"]
rhi = ["vulkan"]
renderer = ["forward"]
mesh_simplifier = ["meshoptimizer"]
tangent_generator = ["mikktspace"]
animation = ["ozz"]
physics3d = ["jolt"]
physics2d = ["box2d"]

[modules.linux]
platform = ["sdl3"]
input_device = ["null"]
rhi = ["vulkan"]
renderer = ["forward"]
mesh_simplifier = ["meshoptimizer"]
tangent_generator = ["mikktspace"]
animation = ["ozz"]
physics3d = ["jolt"]
physics2d = ["box2d"]

[audio]
muted = true
