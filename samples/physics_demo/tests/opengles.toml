# The scripted run on the real GPU, with the Direct3D debug layer.
[app]
window = "hidden"
title = "Dream Physics OpenGL ES Check"
width = 960
height = 540
fixed_rate = 120

[demo]
scripted = true

[rhi.opengles]
debug = true

[input.actions]
shoot = ["key:space"]
switch = ["key:tab"]
shapes = ["key:d"]
quit = ["key:escape"]

# Only built on Windows, so only its table is listed.
[modules.windows]
platform = ["sdl3"]
input_device = ["null"]
rhi = ["opengles"]
renderer = ["forward"]
mesh_simplifier = ["meshoptimizer"]
tangent_generator = ["mikktspace"]
animation = ["ozz"]
physics3d = ["jolt"]
physics2d = ["box2d"]

[audio]
muted = true
