# The scripted run with the real physics backends and no GPU. One fixed step per frame, at most.
[app]
window = "hidden"
max_fps = 120
fixed_rate = 120

[demo]
scripted = true

[input.actions]
shoot = ["key:space"]
switch = ["key:tab"]
shapes = ["key:d"]
quit = ["key:escape"]

[modules.windows]
platform = ["sdl3"]
input_device = ["null"]
rhi = ["null"]
renderer = ["forward"]
mesh_simplifier = ["meshoptimizer"]
tangent_generator = ["mikktspace"]
animation = ["ozz"]
physics3d = ["jolt"]
physics2d = ["box2d"]

[modules.android]
platform = ["sdl3"]
input_device = ["null"]
rhi = ["null"]
renderer = ["forward"]
mesh_simplifier = ["meshoptimizer"]
tangent_generator = ["mikktspace"]
animation = ["ozz"]
physics3d = ["jolt"]
physics2d = ["box2d"]

[modules.linux]
platform = ["sdl3"]
input_device = ["null"]
rhi = ["null"]
renderer = ["forward"]
mesh_simplifier = ["meshoptimizer"]
tangent_generator = ["mikktspace"]
animation = ["ozz"]
physics3d = ["jolt"]
