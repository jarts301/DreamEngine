# The scripted run with the null backends: no collisions, so only loading, stepping and drawing are checked.
[app]
window = "hidden"
max_fps = 120
fixed_rate = 120

[demo]
scripted = true

[input.actions]
shoot = ["key:space"]
switch = ["key:tab"]
shapes = ["key:d"]
quit = ["key:escape"]

[audio]
muted = true

# Automated: the window is hidden, so no page is served, and frames are drawn on the CPU.
[modules.linux]
platform = ["web"]
input_device = ["null"]
rhi = ["software"]
renderer = ["software"]
mesh_simplifier = ["null"]
tangent_generator = ["null"]
animation = ["null"]
physics3d = ["null"]
physics2d = ["null"]
