# The game with the timeline profiler. cmake/tests/check_trace.cmake runs it and reads the trace.
[app]
title = "Dream Hello"
max_fps = 0

[platform.null]
frame_limit = 3

[input.actions]
confirm = ["key:space"]
quit = ["key:escape"]

# Relative to the working directory, which the test sets.
[profiler.timeline]
path = "dream_hello_game_profiler_trace.json"

# Profiling targets PC for now, so this test is not built for Android.
[modules.windows]
platform = ["null"]
profiler = ["timeline"]

[modules.linux]
platform = ["null"]
profiler = ["timeline"]
