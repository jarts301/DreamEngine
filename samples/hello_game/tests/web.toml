# The web platform with its window hidden: no page is served, but assets and user files are real.
[app]
window = "hidden"
organization = "DreamEngine"
name = "DreamHelloTest"
max_fps = 0

[hello]
quit_after_frames = 3

[input.actions]
confirm = ["key:space"]
quit = ["key:escape"]

[audio]
muted = true

[modules.linux]
platform = ["web"]
input_device = ["null"]
