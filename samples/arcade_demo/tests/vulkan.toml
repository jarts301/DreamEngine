# The scripted run on the real GPU and sound hardware, with Vulkan validation.
[app]
title = "Dream Arcade Check"
width = 960
height = 540
fixed_rate = 120

[demo]
scripted = true

[rhi.vulkan]
validation = true

[input.actions]
throw = ["key:space"]
menu = ["key:escape"]
debug = ["key:f1"]

# Compares frame 30 with the reference image, within a tolerance. See docs/adr/0021.
[screenshot]
frame = 30
save = "arcade_vulkan_screenshot.png"
reference = "assets:/screenshots/arcade.png"
tolerance = 24
max_differing = 0.01
quit = false

[modules.windows]
platform = ["sdl3"]
rhi = ["vulkan"]
renderer = ["forward"]
physics3d = ["jolt"]
audio = ["miniaudio"]
ui = ["rmlui"]
debug_ui = ["imgui"]

[modules.android]
platform = ["sdl3"]
rhi = ["vulkan"]
renderer = ["forward"]
physics3d = ["jolt"]
audio = ["miniaudio"]
ui = ["rmlui"]
debug_ui = ["imgui"]

[modules.linux]
platform = ["sdl3"]
rhi = ["vulkan"]
renderer = ["forward"]
physics3d = ["jolt"]
audio = ["miniaudio"]
ui = ["rmlui"]
debug_ui = ["imgui"]
