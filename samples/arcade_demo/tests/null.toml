# The scripted run with every null backend.
[app]
window = "hidden"
max_fps = 120
fixed_rate = 120

[demo]
scripted = true

[input.actions]
throw = ["key:space"]
menu = ["key:escape"]
debug = ["key:f1"]

[modules.windows]
platform = ["sdl3"]
input_device = ["null"]
rhi = ["null"]
renderer = ["forward"]
mesh_simplifier = ["meshoptimizer"]
tangent_generator = ["mikktspace"]
animation = ["ozz"]
physics3d = ["null"]
audio = ["null"]
ui = ["null"]
debug_ui = ["null"]
texture_decoder = ["ktx", "null"]

[modules.android]
platform = ["sdl3"]
input_device = ["null"]
rhi = ["null"]
