# The scripted run with every null backend.
[app]
window = "hidden"
max_fps = 120
fixed_rate = 120

[demo]
scripted = true

[input.actions]
throw = ["key:space"]
menu = ["key:escape"]
debug = ["key:f1"]

[audio]
muted = true

# Automated: the window is hidden, so no page is served.
[modules.linux]
platform = ["web"]
input_device = ["null"]
rhi = ["null"]
renderer = ["null"]
mesh_simplifier = ["null"]
tangent_generator = ["null"]
animation = ["null"]
physics3d = ["null"]
audio = ["null"]
ui = ["null"]
debug_ui = ["null"]
