# The scripted run with the real backends and no GPU or sound hardware. One fixed step per frame,
# at most.
[app]
window = "hidden"
max_fps = 120
fixed_rate = 120

[demo]
scripted = true

[input.actions]
throw = ["key:space"]
menu = ["key:escape"]
debug = ["key:f1"]

[audio]
muted = true

# Automated: the window is hidden, so no page is served, and frames are drawn on the CPU.
[modules.linux]
platform = ["web"]
input_device = ["null"]
rhi = ["software"]
renderer = ["software"]
mesh_simplifier = ["meshoptimizer"]
tangent_generator = ["mikktspace"]
animation = ["ozz"]
physics3d = ["impulse"]
audio = ["null"]
ui = ["markup"]
debug_ui = ["imgui"]
