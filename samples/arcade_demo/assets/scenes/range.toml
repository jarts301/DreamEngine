# A target range: towers of crates to knock down by throwing balls. Crate and ball models are 2 m
# across, so their scale is their half size.

[entities.camera.transform]
position = [0.0, 3.5, 12.0]

[entities.camera.camera]
vertical_fov = 50.0
target = [0.0, 1.5, 0.0]

[entities.camera.audio_listener]

[entities.music.audio_source]
sound = "assets:/sounds/music.wav"
bus = "music"
loop = true

[entities.sun.directional_light]
direction = [-0.4, -1.0, -0.7]
color = [1.0, 0.95, 0.85]
intensity = 1.3
ambient = 0.3

# The floor's top is at y = 0. Its model is a child, because the body sits half a meter lower.
[entities.ground.transform]
position = [0.0, -0.5, 0.0]

[entities.ground.rigid_body]
motion = "static"
half_extents = [10.0, 0.5, 10.0]
friction = 0.8

[entities.ground_surface]
parent = "ground"

[entities.ground_surface.transform]
position = [0.0, 0.5, 0.0]
scale = [10.0, 1.0, 10.0]

[entities.ground_surface.mesh]
model = "assets:/models/ground.glb"

[entities.wall.transform]
position = [0.0, 2.0, -6.0]
scale = [10.0, 2.0, 0.5]

[entities.wall.mesh]
model = "assets:/models/crate.glb"
tint = [0.45, 0.5, 0.6]

[entities.wall.rigid_body]
motion = "static"
half_extents = [10.0, 2.0, 0.5]

# Three towers of three crates. Each crate is a target, scored once when a ball hits it.
[entities.left_1.transform]
position = [-3.0, 0.5, -1.0]
scale = [0.5, 0.5, 0.5]
[entities.left_1.mesh]
model = "assets:/models/crate.glb"
[entities.left_1.rigid_body]
mass = 2.0
[entities.left_1.target]

[entities.left_2.transform]
