[app]
organization = "DreamEngine"
name = "DreamArcade"
title = "Dream Arcade"
width = 1280
height = 720

[demo]
debug_tools = false

# On PC, each run saves a profile here, in the folder the game was started from. Open it at
# https://ui.perfetto.dev. Listing profiler = ["null"] instead turns profiling off.
[profiler.timeline]
path = "dream_arcade_trace.json"

# Memory is watched with the engine's defaults. A game can also give itself a budget, as
# docs/reports/memory-budgets.md explains:
[memory]
budget_mb = 1024

[input.actions]
throw = ["key:space", "mouse:left", "touch"]
menu = ["key:escape", "key:back"]
debug = ["key:f1"]

[modules.windows]
platform = ["sdl3"]
rhi = ["vulkan", "directx", "null"]
physics3d = ["impulse", "jolt"]
audio = ["portaudio", "miniaudio", "null"]
ui = ["markup", "rmlui"]
debug_ui = ["imgui"]
profiler = ["timeline"]

[modules.android]
platform = ["sdl3"]
rhi = ["vulkan", "null"]
physics3d = ["jolt"]
audio = ["miniaudio", "null"]
ui = ["rmlui"]
debug_ui = ["imgui"]

[modules.linux]
platform = ["sdl3"]
rhi = ["vulkan", "null"]
physics3d = ["jolt"]
audio = ["miniaudio", "null"]
ui = ["rmlui"]
debug_ui = ["imgui"]
profiler = ["timeline"]
