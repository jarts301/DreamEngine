[app]
organization = "DreamEngine"
name = "DreamArcade"
title = "Dream Arcade"
width = 1280
height = 720

[demo]
debug_tools = false

# On PC, each run saves a profile here, in the folder the game was started from. Open it at
# https://ui.perfetto.dev. Listing profiler = ["null"] instead turns profiling off.
[profiler.timeline]
path = "dream_arcade_trace.json"

# The most private memory the game means to use. Near it, the game is warned, and over it, new
# assets are refused until it frees some. See docs/reports/memory-budgets.md.
[memory]
budget_mb = 1024

# When the game crashes, a report is written to crash_reports/, in the folder the game was started
# from, with a minidump beside it on Windows. See docs/reports/crash-reports.md.
#
# To try it, set simulate to "null_pointer", "divide_by_zero", "stack_overflow", "abort", "assert"
# or "terminate", and the game crashes that way after simulate_after_frames frames, about 5
# seconds at 60 FPS. "none" turns the simulation off.
[crash_report]
simulate = "none"
simulate_after_frames = 300

[input.actions]
throw = ["key:space", "mouse:left", "touch"]
menu = ["key:escape", "key:back"]
debug = ["key:f1"]

[modules.windows]
platform = ["sdl3"]
rhi = ["vulkan", "directx", "null"]
physics3d = ["impulse", "jolt"]
audio = ["portaudio", "miniaudio", "null"]
ui = ["markup", "rmlui"]
debug_ui = ["imgui"]
profiler = ["timeline"]

[modules.android]
platform = ["sdl3"]
rhi = ["vulkan", "null"]
physics3d = ["jolt"]
audio = ["miniaudio", "null"]
ui = ["rmlui"]
debug_ui = ["imgui"]

[modules.linux]
platform = ["sdl3"]
rhi = ["vulkan", "null"]
physics3d = ["jolt"]
audio = ["miniaudio", "null"]
ui = ["rmlui"]
debug_ui = ["imgui"]
profiler = ["timeline"]
