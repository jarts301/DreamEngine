# A small arena for the ball the player moves (docs/guides/input.md).

[entities.camera.transform]
position = [0.0, 9.0, 9.0]

[entities.camera.camera]
vertical_fov = 45.0
target = [0.0, 0.0, 0.5]

[entities.sun.directional_light]
direction = [-0.4, -1.0, -0.5]
intensity = 1.3
ambient = 0.35

[entities.ground.transform]
scale = [5.0, 1.0, 5.0]

[entities.ground.mesh]
model = "assets:/models/ground.glb"

[entities.ball.transform]
position = [0.0, 0.5, 0.0]
scale = [0.5, 0.5, 0.5]

[entities.ball.mesh]
model = "assets:/models/ball.glb"
tint = [0.95, 0.55, 0.1]
