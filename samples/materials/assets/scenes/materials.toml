# How surfaces answer light (docs/guides/materials.md). The back row is plastic and the middle row
# metal, each from mirror-smooth on the left to fully rough on the right. In front: a brick wall with
# a normal map, gold, blended glass, a fence cut out by its texture's alpha and seen from both sides,
# and a lamp whose emission is brighter than white, so it glows. The sky lights them all and shows in
# the smooth ones.

