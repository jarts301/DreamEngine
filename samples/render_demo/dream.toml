[app]
organization = "DreamEngine"
name = "DreamRenderer"
title = "Dream Renderer"
width = 1280
height = 720

[input.actions]
toggle_spin = ["key:space", "mouse:left", "touch", "gamepad:south"]
quit = ["key:escape", "gamepad:back"]
orbit_left = ["key:a", "key:left", "gamepad:left_stick_left", "gamepad:dpad_left"]
orbit_right = ["key:d", "key:right", "gamepad:left_stick_right", "gamepad:dpad_right"]
zoom_in = ["key:w", "key:up", "gamepad:left_stick_up", "gamepad:right_trigger"]
zoom_out = ["key:s", "key:down", "gamepad:left_stick_down", "gamepad:left_trigger"]
next_animation = ["key:n", "gamepad:north"]

[modules.windows]
platform = ["sdl3"]
input_device = ["sdl3_gamepad", "null"]
rhi = ["vulkan", "directx12", "directx", "opengl", "opengles", "null"]
renderer = ["forward_plus", "forward", "null"]
mesh_simplifier = ["meshoptimizer", "null"]
tangent_generator = ["mikktspace", "null"]
animation = ["ozz", "null"]
particles = ["cpu", "null"]
texture_decoder = ["ktx", "null"]

[modules.android]
platform = ["sdl3"]
input_device = ["sdl3_gamepad", "null"]
rhi = ["vulkan", "opengles", "null"]
renderer = ["forward_plus", "forward", "null"]
mesh_simplifier = ["meshoptimizer", "null"]
tangent_generator = ["mikktspace", "null"]
animation = ["ozz", "null"]
particles = ["cpu", "null"]
texture_decoder = ["ktx", "null"]

[modules.linux]
platform = ["sdl3"]
input_device = ["sdl3_gamepad", "null"]
rhi = ["vulkan", "null"]
renderer = ["forward_plus", "forward", "null"]
mesh_simplifier = ["meshoptimizer", "null"]
tangent_generator = ["mikktspace", "null"]
animation = ["ozz", "null"]
particles = ["cpu", "null"]
texture_decoder = ["ktx", "null"]

# What the editor opens (ADR 0046): dream_editor samples/render_demo
[editor]
scene = "assets:/scenes/yard.toml"
game = "dream_render_demo"
assets = ["assets", "../assets"]
build = "../../build/windows-debug"
