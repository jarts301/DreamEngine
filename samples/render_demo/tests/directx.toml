[app]
window = "hidden"
title = "Dream Renderer DirectX Check"
width = 960
height = 540

[demo]
animation_time = 0.5
quit_after_frames = 600
spin = false

[rhi.directx]
debug = true

[input.actions]
toggle_spin = ["key:space"]
quit = ["key:escape"]
orbit_left = ["key:a", "key:left"]
orbit_right = ["key:d", "key:right"]
zoom_in = ["key:w", "key:up"]
zoom_out = ["key:s", "key:down"]
next_animation = ["key:n"]

# Compares frame 60 with the reference image, within a tolerance. See docs/adr/0021.
[screenshot]
frame = 60
save = "render_demo_directx_screenshot.png"
reference = "assets:/screenshots/render_demo.png"
tolerance = 24
max_differing = 0.01
quit = false

# Only built on Windows, so only its table is listed.
[modules.windows]
platform = ["sdl3"]
input_device = ["null"]
rhi = ["directx"]
renderer = ["forward_plus"]
mesh_simplifier = ["meshoptimizer"]
tangent_generator = ["mikktspace"]
animation = ["ozz"]

[audio]
muted = true
