# Draws the yard with the software renderer and compares one frame with the reference image,
# within a tolerance, on any machine: no GPU, display or sound card (ADR 0021, ADR 0039).
[app]
window = "hidden"
title = "Screenshot Check"
width = 960
height = 540

[demo]
animation_time = 0.5
particle_time = 1.5
quit_after_frames = 600
spin = false

[input.actions]
toggle_spin = ["key:space"]
quit = ["key:escape"]
orbit_left = ["key:a", "key:left"]
orbit_right = ["key:d", "key:right"]
zoom_in = ["key:w", "key:up"]
zoom_out = ["key:s", "key:down"]
next_animation = ["key:n"]

[screenshot]
frame = 60
save = "render_demo_screenshot.png"
reference = "assets:/screenshots/render_demo.png"
tolerance = 24
max_differing = 0.01
quit = true

[audio]
muted = true

[modules.linux]
platform = ["web"]
input_device = ["null"]
rhi = ["software"]
renderer = ["software"]
mesh_simplifier = ["meshoptimizer"]
tangent_generator = ["mikktspace"]
animation = ["ozz"]
particles = ["cpu"]
