[app]
title = "Dream Renderer Check"
width = 960
height = 540

[demo]
quit_after_frames = 600
spin = false

[rhi.vulkan]
validation = true

[input.actions]
toggle_spin = ["key:space"]
quit = ["key:escape"]

# Compares frame 60 with the reference image, within a tolerance. See docs/adr/0021.
[screenshot]
frame = 60
save = "render_demo_vulkan_screenshot.png"
reference = "assets:/screenshots/render_demo.png"
tolerance = 24
max_differing = 0.01
quit = false

[modules.windows]
platform = ["sdl3"]
rhi = ["vulkan"]
renderer = ["forward"]

[modules.android]
platform = ["sdl3"]
rhi = ["vulkan"]
renderer = ["forward"]

[modules.linux]
platform = ["sdl3"]
rhi = ["vulkan"]
renderer = ["forward"]
