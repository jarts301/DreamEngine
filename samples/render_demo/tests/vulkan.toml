[app]
window = "hidden"
title = "Dream Renderer Check"
width = 960
height = 540

[demo]
animation_time = 0.5
particle_time = 1.5
quit_after_frames = 600
spin = false

[rhi.vulkan]
validation = true

[input.actions]
toggle_spin = ["key:space"]
quit = ["key:escape"]
orbit_left = ["key:a", "key:left"]
orbit_right = ["key:d", "key:right"]
zoom_in = ["key:w", "key:up"]
zoom_out = ["key:s", "key:down"]
next_animation = ["key:n"]

# Compares frame 60 with the reference image, within a tolerance. See docs/adr/0021.
[screenshot]
frame = 60
save = "render_demo_vulkan_screenshot.png"
reference = "assets:/screenshots/render_demo.png"
tolerance = 24
max_differing = 0.01
quit = false

[modules.windows]
platform = ["sdl3"]
input_device = ["null"]
rhi = ["vulkan"]
renderer = ["forward_plus"]
mesh_simplifier = ["meshoptimizer"]
tangent_generator = ["mikktspace"]
animation = ["ozz"]
particles = ["cpu"]
texture_decoder = ["ktx", "null"]

[modules.android]
platform = ["sdl3"]
input_device = ["null"]
rhi = ["vulkan"]
renderer = ["forward_plus"]
mesh_simplifier = ["meshoptimizer"]
tangent_generator = ["mikktspace"]
animation = ["ozz"]
particles = ["cpu"]
texture_decoder = ["ktx", "null"]

[modules.linux]
platform = ["sdl3"]
input_device = ["null"]
rhi = ["vulkan"]
renderer = ["forward_plus"]
mesh_simplifier = ["meshoptimizer"]
tangent_generator = ["mikktspace"]
animation = ["ozz"]
particles = ["cpu"]
texture_decoder = ["ktx", "null"]

[audio]
muted = true
