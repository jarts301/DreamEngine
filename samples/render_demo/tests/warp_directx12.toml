# The Direct3D 12 check on WARP, Windows' software rasterizer, so build servers without a GPU
# compare the picture too. CTest runs it.
[app]
window = "hidden"
title = "Screenshot Check"
width = 960
height = 540

[demo]
animation_time = 0.5
particle_time = 1.5
quit_after_frames = 600
spin = false

[input.actions]
toggle_spin = ["key:space"]
quit = ["key:escape"]
orbit_left = ["key:a", "key:left"]
orbit_right = ["key:d", "key:right"]
zoom_in = ["key:w", "key:up"]
zoom_out = ["key:s", "key:down"]
next_animation = ["key:n"]


[rhi.directx12]
software = true
debug = false

# Compares frame 60 with the reference image, within a tolerance. See docs/adr/0021.
[screenshot]
frame = 60
save = "render_demo_warp12_screenshot.png"
reference = "assets:/screenshots/render_demo.png"
tolerance = 24
max_differing = 0.01
quit = true

# Only built on Windows, so only its table is listed.
[modules.windows]
platform = ["sdl3"]
input_device = ["null"]
rhi = ["directx12"]
renderer = ["forward_plus"]
mesh_simplifier = ["meshoptimizer"]
tangent_generator = ["mikktspace"]
animation = ["ozz"]
particles = ["cpu"]
texture_decoder = ["ktx", "null"]

[audio]
muted = true
