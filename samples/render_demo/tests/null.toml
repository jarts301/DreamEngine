[app]
window = "hidden"
max_fps = 0

[demo]
animation_time = 0.5
particle_time = 1.5
quit_after_frames = 5

[input.actions]
toggle_spin = ["key:space"]
quit = ["key:escape"]
orbit_left = ["key:a", "key:left"]
orbit_right = ["key:d", "key:right"]
zoom_in = ["key:w", "key:up"]
zoom_out = ["key:s", "key:down"]
next_animation = ["key:n"]

[audio]
muted = true

# Automated: the window is hidden, so no page is served, and frames are drawn on the CPU.
[modules.linux]
platform = ["web"]
input_device = ["null"]
rhi = ["software"]
renderer = ["software"]
mesh_simplifier = ["meshoptimizer"]
tangent_generator = ["mikktspace"]
animation = ["ozz"]
particles = ["cpu"]
