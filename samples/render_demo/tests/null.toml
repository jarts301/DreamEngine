[app]
window = "hidden"
max_fps = 0

[demo]
animation_time = 0.5
quit_after_frames = 5

[input.actions]
toggle_spin = ["key:space"]
quit = ["key:escape"]
orbit_left = ["key:a", "key:left"]
orbit_right = ["key:d", "key:right"]
zoom_in = ["key:w", "key:up"]
zoom_out = ["key:s", "key:down"]
next_animation = ["key:n"]

[modules.windows]
platform = ["sdl3"]
input_device = ["null"]
rhi = ["null"]
renderer = ["forward_plus"]
mesh_simplifier = ["meshoptimizer"]
tangent_generator = ["mikktspace"]
animation = ["ozz"]

[modules.android]
platform = ["sdl3"]
input_device = ["null"]
rhi = ["null"]
renderer = ["forward_plus"]
mesh_simplifier = ["meshoptimizer"]
tangent_generator = ["mikktspace"]
animation = ["ozz"]

[modules.linux]
platform = ["sdl3"]
input_device = ["null"]
rhi = ["null"]
renderer = ["forward_plus"]
mesh_simplifier = ["meshoptimizer"]
tangent_generator = ["mikktspace"]
animation = ["ozz"]

[audio]
muted = true
