[app]
window = "hidden"
title = "Dream Render Targets Direct3D 11 Check"
width = 960
height = 540

[demo]
spin = false
quit_after_frames = 120

[rhi.directx]
debug = true

[input.actions]
toggle_spin = ["key:space"]
quit = ["key:escape"]

# Compares frame 30 with the reference image, within a tolerance. See docs/adr/0021.
[screenshot]
frame = 30
save = "render_targets_directx_screenshot.png"
reference = "assets:/screenshots/render_targets.png"
tolerance = 24
max_differing = 0.01
quit = true

# Only built on Windows, so only its table is listed.
[modules.windows]
platform = ["sdl3"]
input_device = ["null"]
rhi = ["directx"]

[audio]
muted = true
