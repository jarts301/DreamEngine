[app]
window = "hidden"
max_fps = 0

[demo]
script = true

[input.actions]
move_left = ["key:a"]
move_right = ["key:d"]
jump = ["key:space"]
touch = ["touch"]
quit = ["key:escape"]

[modules.windows]
platform = ["sdl3"]
input_device = ["null"]
rhi = ["null"]
renderer = ["forward"]
physics2d = ["box2d"]
texture_decoder = ["ktx", "null"]

[modules.android]
platform = ["sdl3"]
input_device = ["null"]
rhi = ["null"]
renderer = ["forward"]
physics2d = ["box2d"]
texture_decoder = ["ktx", "null"]

[modules.linux]
platform = ["sdl3"]
input_device = ["null"]
rhi = ["null"]
renderer = ["forward"]
physics2d = ["box2d"]
texture_decoder = ["ktx", "null"]

[audio]
muted = true

# The hero, coins and sign, packed into one image at build time (ADR 0052), so they are drawn
# together. Sprites name them as atlas = "assets:/atlases/things.atlas" and region = "hero".
[atlases.things]
folder = "assets:/sprites/things"
