# The platformer's level (see docs/guides/sprites.md): a tile map with its colliders and swaying
# flowers, clouds and distant hills behind it that move slower than the level (parallax), water in
# its pits, a sign stretched from a 9-slice sprite, the hero and coins. The map's bottom left corner is at the world's origin,
# one world unit per 16-pixel tile.

[entities.camera.transform]
position = [8.0, 4.5, 0.0]

[entities.camera.camera_2d]
height = 9.0
min_width = 12.0      # On a phone held upright, still 12 units across.

[entities.sky.transform]
position = [0.0, 5.0, 0.0]

[entities.hills.transform]
position = [0.0, 1.5, 0.0]

[entities.hills.sprite]
texture = "assets:/sprites/hills.png"
pixels_per_unit = 8.0
pivot = [0.0, 0.0]
layer = -2

[entities.hills.parallax]
factor = [0.3, 1.0]   # A third as far across as the level: far away.
repeat_x = true

[entities.sky.parallax]
factor = [0.6, 1.0]
repeat_x = true

[entities.sky.tile_map]
tileset = "assets:/sprites/tiles.png"
layer = -1
alpha = 0.9
rows = [
    "................................................",
    "...........<>.............<>....................",
    "..................<>..................<>........",
    "................................................",
]

[entities.sky.tile_map.legend]
"<" = 6
">" = 7

[entities.level.tile_map]
tileset = "assets:/sprites/tiles.png"
solid = [0, 1, 2, 3]
rows = [
    "................................................",
    "................................................",
    "................................................",
    "..........................................BBB...",
    "....................PPP..............BBB........",
    "................................................",
    "............PPPP..........BB....................",
    ".........................BBBB...................",
    "........................BBBBBB..............f...",
    "...f..b.......f....b...BBBBBBBB....GGGG...GGGGGG",
    "GGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGG..DDDD...DDDDDD",
    "DDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDD..DDDD...DDDDDD",
]

[entities.level.tile_map.legend]
G = 0
D = 1
B = 2
P = 3
b = 4
f = 5

# Flowers sway: tile 5 shows 5, 8, 5 and 9 in turn.
[entities.level.tile_map.animations.f]
frames = [5, 8, 5, 9]
fps = 3.0

# Water in the pits, in front of the hero.
[entities.water.tile_map]
tileset = "assets:/sprites/tiles.png"
layer = 2
alpha = 0.85
rows = [
    ".................................ww....www......",
    ".................................ww....www......",
]

[entities.water.tile_map.legend]
w = 10

[entities.water.tile_map.animations.w]
frames = [10, 11]
fps = 2.0

[entities.sign.transform]
position = [11.0, 2.0, 0.0]

# A 16-pixel board whose 4-pixel edges keep their size as it stretches to 2.5 by 1.25.
[entities.sign.sprite]
atlas = "assets:/atlases/things.atlas"
region = "sign"
size = [2.5, 1.25]
pivot = [0.5, 0.0]
slice = 4

[entities.hero.transform]
position = [3.5, 2.45, 0.0]

[entities.hero.sprite]
atlas = "assets:/atlases/things.atlas"
region = "hero"
columns = 4
rows = 2
pivot = [0.5, 0.45]
layer = 1

[entities.hero.sprite_animator]
clip = "idle"

[entities.hero.sprite_animator.clips.idle]
frames = [0, 1]
fps = 2.0

[entities.hero.sprite_animator.clips.run]
frames = [2, 3, 4, 5]
fps = 10.0

[entities.hero.sprite_animator.clips.jump]
frames = [6]

[entities.hero.sprite_animator.clips.fall]
frames = [7]

[entities.hero.rigid_body_2d]
shape = "capsule"
radius = 0.3
half_height = 0.15
fixed_rotation = true
friction = 0.0

[entities.coin_0.transform]
position = [8.5, 2.6, 0.0]

[entities.coin_0.sprite]
atlas = "assets:/atlases/things.atlas"
region = "coin"
columns = 4

[entities.coin_0.sprite_animator]
clip = "spin"
time = 0.0

[entities.coin_0.sprite_animator.clips.spin]
frames = [0, 1, 2, 3]
fps = 8.0

[entities.coin_0.coin]

[entities.coin_1.transform]
position = [13.5, 6.6, 0.0]

[entities.coin_1.sprite]
atlas = "assets:/atlases/things.atlas"
