fps = 8.0

[entities.coin_2.coin]

[entities.coin_3.transform]
position = [27.5, 7.6, 0.0]

[entities.coin_3.sprite]
atlas = "assets:/atlases/things.atlas"
region = "coin"
columns = 4

[entities.coin_3.sprite_animator]
