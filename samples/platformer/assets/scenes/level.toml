[entities.coin_3.sprite_animator.clips.spin]
frames = [0, 1, 2, 3]
fps = 8.0

[entities.coin_3.coin]

[entities.coin_4.transform]
position = [37.5, 3.6, 0.0]

[entities.coin_4.sprite]
atlas = "assets:/atlases/things.atlas"
region = "coin"
columns = 4

[entities.coin_4.sprite_animator]
clip = "spin"
time = 0.4

[entities.coin_4.sprite_animator.clips.spin]
frames = [0, 1, 2, 3]
fps = 8.0

[entities.coin_4.coin]

[entities.coin_5.transform]
position = [43.5, 9.6, 0.0]

[entities.coin_5.sprite]
atlas = "assets:/atlases/things.atlas"
region = "coin"
columns = 4

[entities.coin_5.sprite_animator]
clip = "spin"
time = 0.5

[entities.coin_5.sprite_animator.clips.spin]
