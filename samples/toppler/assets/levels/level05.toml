# Shelf: three gold crates along a shelf, with plain ones between.

[entities.rules.level]
name = "Shelf"
throws = 5
par = 3

[entities.camera.transform]
position = [0.0, 4.2, 9.5]

[entities.camera.camera]
vertical_fov = 50.0
target = [0.0, 2.0, -1.5]

[entities.camera.audio_listener]

[entities.music.audio_source]
sound = "assets:/sounds/music.wav"
bus = "music"
loop = true

[entities.sun.directional_light]
direction = [-0.4, -1.0, -0.6]
color = [1.0, 0.95, 0.85]
intensity = 1.3
ambient = 0.32

# The floor's top is at y = 0. Its model is a child, because the body sits half a meter lower.
[entities.ground.transform]
position = [0.0, -0.5, 0.0]

[entities.ground.rigid_body]
motion = "static"
half_extents = [14.0, 0.5, 14.0]
friction = 0.8

[entities.ground_surface]
parent = "ground"

[entities.ground_surface.transform]
position = [0.0, 0.5, 0.0]
scale = [14.0, 1.0, 14.0]

[entities.ground_surface.mesh]
model = "assets:/models/ground.glb"

[entities.backdrop.transform]
position = [0.0, 4.0, -9.0]
scale = [14.0, 4.0, 0.5]

[entities.backdrop.mesh]
model = "assets:/models/block.glb"
tint = [0.36, 0.42, 0.55]

[entities.backdrop.rigid_body]
motion = "static"
half_extents = [14.0, 4.0, 0.5]

