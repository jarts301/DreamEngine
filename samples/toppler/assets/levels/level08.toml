# Dominoes: a row of slabs, one behind the other, and gold on a post beyond them.

[entities.rules.level]
name = "Dominoes"
throws = 3
par = 1

[entities.camera.transform]
position = [0.0, 4.2, 9.5]

[entities.camera.camera]
vertical_fov = 50.0
target = [0.0, 2.0, -1.5]

[entities.camera.audio_listener]

[entities.music.audio_source]
sound = "assets:/sounds/music.wav"
bus = "music"
loop = true

[entities.sun.directional_light]
direction = [-0.4, -1.0, -0.6]
color = [1.0, 0.95, 0.85]
intensity = 1.3
ambient = 0.32

# The floor's top is at y = 0. Its model is a child, because the body sits half a meter lower.
