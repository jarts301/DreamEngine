# Plays every level on the real GPU and sound hardware. Not a CTest, as build servers have neither.
[app]
window = "hidden"
organization = "DreamEngine"
name = "TopplerCheck"       # Its own storage, apart from a player's saved progress.
title = "Toppler Vulkan Check"
width = 960
height = 540
fixed_rate = 120

[demo]
scripted = true

[rhi.vulkan]
validation = true

[input.actions]
throw = ["mouse:left"]
menu = ["key:escape"]

# Compares frame 150 with the reference image, within a tolerance. See docs/adr/0021.
[screenshot]
frame = 150
save = "toppler_vulkan_screenshot.png"
reference = "assets:/screenshots/toppler.png"
tolerance = 24
max_differing = 0.01
quit = false

[modules.windows]
platform = ["sdl3"]
input_device = ["null"]
rhi = ["vulkan"]
renderer = ["forward"]
mesh_simplifier = ["meshoptimizer"]
tangent_generator = ["mikktspace"]
physics3d = ["jolt"]
audio = ["miniaudio"]
ui = ["rmlui"]

[modules.android]
platform = ["sdl3"]
input_device = ["null"]
rhi = ["vulkan"]
renderer = ["forward"]
mesh_simplifier = ["meshoptimizer"]
tangent_generator = ["mikktspace"]
physics3d = ["jolt"]
audio = ["miniaudio"]
ui = ["rmlui"]

[modules.linux]
platform = ["sdl3"]
input_device = ["null"]
rhi = ["vulkan"]
renderer = ["forward"]
mesh_simplifier = ["meshoptimizer"]
tangent_generator = ["mikktspace"]
physics3d = ["jolt"]
audio = ["miniaudio"]
ui = ["rmlui"]

[audio]
muted = true
