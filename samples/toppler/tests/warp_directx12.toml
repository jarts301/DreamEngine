# The Direct3D 12 check on WARP, Windows' software rasterizer, so build servers without a GPU
# compare the picture too. CTest runs it.
[app]
organization = "DreamEngine"
name = "TopplerCheck"       # Its own storage, apart from a player's saved progress.
title = "Screenshot Check"
width = 960
height = 540
fixed_rate = 120

[demo]
scripted = true

[input.actions]
throw = ["mouse:left"]
menu = ["key:escape"]

[rhi.directx12]
software = true
debug = false

[audio.miniaudio]
device = false

# Compares frame 150 with the reference image, within a tolerance. See docs/adr/0021.
[screenshot]
frame = 150
save = "toppler_warp12_screenshot.png"
reference = "assets:/screenshots/toppler.png"
tolerance = 24
max_differing = 0.01
quit = true

[modules.windows]
platform = ["sdl3"]
rhi = ["directx12"]
physics3d = ["jolt"]
audio = ["miniaudio"]
ui = ["rmlui"]
