# Plays every level with no graphics device or sound hardware, as CTest does.
[app]
window = "hidden"
organization = "DreamEngine"
name = "TopplerCheck"       # Its own storage, apart from a player's saved progress.
title = "Toppler Check"
max_fps = 120
fixed_rate = 120

[demo]
scripted = true

[input.actions]
throw = ["mouse:left"]
menu = ["key:escape"]

[audio]
muted = true

# Automated: the window is hidden, so no page is served, and frames are drawn on the CPU.
[modules.linux]
platform = ["web"]
input_device = ["null"]
rhi = ["software"]
renderer = ["software"]
mesh_simplifier = ["meshoptimizer"]
tangent_generator = ["mikktspace"]
animation = ["ozz"]
physics3d = ["impulse"]
audio = ["null"]
ui = ["markup"]
