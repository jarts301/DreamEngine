# Plays every level with no graphics device or sound hardware, as CTest does.
[app]
window = "hidden"
organization = "DreamEngine"
name = "TopplerCheck"       # Its own storage, apart from a player's saved progress.
title = "Toppler Check"
max_fps = 120
fixed_rate = 120

[demo]
scripted = true

[audio.miniaudio]
device = false

[input.actions]
throw = ["mouse:left"]
menu = ["key:escape"]

[modules.windows]
platform = ["sdl3"]
input_device = ["null"]
rhi = ["null"]
renderer = ["forward"]
mesh_simplifier = ["meshoptimizer"]
tangent_generator = ["mikktspace"]
animation = ["ozz"]
physics3d = ["jolt"]
audio = ["miniaudio"]
ui = ["rmlui"]
texture_decoder = ["ktx", "null"]

[modules.android]
platform = ["sdl3"]
input_device = ["null"]
rhi = ["null"]
renderer = ["forward"]
mesh_simplifier = ["meshoptimizer"]
tangent_generator = ["mikktspace"]
animation = ["ozz"]
physics3d = ["jolt"]
audio = ["miniaudio"]
ui = ["rmlui"]
texture_decoder = ["ktx", "null"]

[modules.linux]
platform = ["sdl3"]
input_device = ["null"]
rhi = ["null"]
renderer = ["forward"]
mesh_simplifier = ["meshoptimizer"]
tangent_generator = ["mikktspace"]
animation = ["ozz"]
physics3d = ["jolt"]
audio = ["miniaudio"]
ui = ["rmlui"]
texture_decoder = ["ktx", "null"]

[audio]
muted = true
