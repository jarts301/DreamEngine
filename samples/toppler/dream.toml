[app]
organization = "DreamEngine"
name = "Toppler"
title = "Toppler"
width = 1280
height = 720

[input.actions]
throw = ["mouse:left", "touch"]
menu = ["key:escape", "key:back", "gamepad:start"]

[modules.windows]
platform = ["sdl3"]
input_device = ["sdl3_gamepad", "null"]
rhi = ["vulkan", "directx12", "directx", "opengl", "opengles", "null"]
renderer = ["forward", "null"]
mesh_simplifier = ["meshoptimizer", "null"]
tangent_generator = ["mikktspace", "null"]
animation = ["ozz", "null"]
physics3d = ["jolt", "impulse"]
audio = ["miniaudio", "portaudio", "null"]
ui = ["rmlui", "markup"]
texture_decoder = ["ktx", "null"]

[modules.android]
platform = ["sdl3"]
input_device = ["sdl3_gamepad", "null"]
rhi = ["vulkan", "opengles", "null"]
renderer = ["forward", "null"]
mesh_simplifier = ["meshoptimizer", "null"]
tangent_generator = ["mikktspace", "null"]
animation = ["ozz", "null"]
physics3d = ["jolt", "impulse"]
audio = ["miniaudio", "null"]
ui = ["rmlui", "markup"]
texture_decoder = ["ktx", "null"]

[modules.linux]
platform = ["sdl3"]
input_device = ["sdl3_gamepad", "null"]
rhi = ["vulkan", "null"]
renderer = ["forward", "null"]
mesh_simplifier = ["meshoptimizer", "null"]
tangent_generator = ["mikktspace", "null"]
animation = ["ozz", "null"]
physics3d = ["jolt", "impulse"]
audio = ["miniaudio", "null"]
ui = ["rmlui", "markup"]
texture_decoder = ["ktx", "null"]

# What the editor opens (ADR 0046): dream_editor samples/toppler
[editor]
scene = "assets:/levels/level01.toml"
game = "dream_toppler"
assets = ["assets", "../assets"]
build = "../../build/windows-debug"
