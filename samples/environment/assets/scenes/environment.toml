# Lighting from the sky (docs/guides/environment.md). The environment lights every surface from
# all around and shows in shiny ones: a mirror ball, brushed and rough metal, gold, white plastic,
# glass. Three lamps glow brighter than white, so bloom spreads their light. The game changes the
# sky's brightness and the sun between day, dusk and night.

[entities.camera.transform]
position = [0.0, 1.8, 7.0]

[entities.camera.camera]
vertical_fov = 40.0
target = [0.0, 0.9, 0.0]

[entities.sun.directional_light]
direction = [-0.5, -1.0, -0.6]
color = [1.0, 0.95, 0.85]
intensity = 1.3

[entities.sky.environment]
map = "assets:/environments/sky.hdr"
intensity = 0.8

[entities.ground.transform]
scale = [6.0, 1.0, 6.0]

[entities.ground.mesh]
model = "assets:/models/ground.glb"

[entities.mirror.transform]
position = [-2.4, 0.8, 0.0]
scale = [0.8, 0.8, 0.8]

[entities.mirror.mesh]
model = "assets:/models/metal_0.glb"

[entities.brushed.transform]
position = [-0.6, 0.6, -0.6]
scale = [0.6, 0.6, 0.6]

[entities.brushed.mesh]
model = "assets:/models/metal_2.glb"

[entities.gold.transform]
position = [0.9, 0.6, -0.2]
scale = [0.6, 0.6, 0.6]

[entities.gold.mesh]
model = "assets:/models/gold_ball.glb"

[entities.plastic.transform]
position = [2.4, 0.7, 0.3]
scale = [0.7, 0.7, 0.7]

[entities.plastic.mesh]
model = "assets:/models/plastic_1.glb"

[entities.rough.transform]
position = [-0.9, 0.35, 1.6]
scale = [0.35, 0.35, 0.35]

[entities.rough.mesh]
model = "assets:/models/metal_4.glb"

[entities.glass.transform]
position = [1.3, 0.8, 1.7]
rotation = [0.0, -20.0, 0.0]

[entities.glass.mesh]
model = "assets:/models/glass_pane.glb"

[entities.lamp_warm.transform]
position = [0.2, 0.25, 1.5]
scale = [0.25, 0.25, 0.25]

[entities.lamp_warm.mesh]
model = "assets:/models/lamp.glb"
casts_shadows = false

[entities.lamp_warm.point_light]
color = [1.0, 0.45, 0.12]
intensity = 1.5
range = 3.0

[entities.lamp_left.transform]
position = [-3.0, 0.2, 1.8]
scale = [0.2, 0.2, 0.2]

[entities.lamp_left.mesh]
model = "assets:/models/lamp_blue.glb"
casts_shadows = false

[entities.lamp_left.point_light]
color = [0.3, 0.6, 1.0]
intensity = 1.2
range = 2.5

[entities.lamp_right.transform]
position = [3.2, 0.2, 1.4]
scale = [0.2, 0.2, 0.2]

[entities.lamp_right.mesh]
model = "assets:/models/lamp_pink.glb"
casts_shadows = false

[entities.lamp_right.point_light]
color = [1.0, 0.3, 0.7]
intensity = 1.2
range = 2.5
