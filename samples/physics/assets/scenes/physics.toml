# Physics in 3D (docs/adr/0011): every body and joint here is a component; the game only steps
# the simulation, sweeps a laser with ray casts, tints what lands in the sensor, and throws balls.
# Box and ball models are 2 m across, so each one's scale is its half size.

[entities.camera.transform]
position = [1.0, 6.0, 11.5]

[entities.camera.camera]
vertical_fov = 45.0
target = [0.0, 1.0, 0.0]

[entities.sun.directional_light]
direction = [-0.5, -1.0, -0.6]
color = [1.0, 0.95, 0.85]
intensity = 1.3
ambient = 0.3

# The floor's top is at y = 0. Its model is a child, because the body sits half a meter lower.
[entities.ground.transform]
position = [0.0, -0.5, 0.0]

[entities.ground.rigid_body]
motion = "static"
half_extents = [10.0, 0.5, 8.0]
friction = 0.8

[entities.ground_surface]
parent = "ground"

[entities.ground_surface.transform]
position = [0.0, 0.5, 0.0]
scale = [10.0, 1.0, 8.0]

[entities.ground_surface.mesh]
model = "assets:/models/ground.glb"

