name: CI

on:
  push:
  workflow_dispatch:

env:
  NDK_VERSION: r30

jobs:
  windows:
    name: Windows (${{ matrix.preset }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        preset: [windows-debug, windows-release]
    steps:
      - uses: actions/checkout@v5

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja --no-progress -y

      - name: Set up vcpkg at the pinned baseline
        shell: pwsh
        run: |
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          $root = "$env:RUNNER_TEMP/vcpkg"
          git clone https://github.com/microsoft/vcpkg $root
          git -C $root checkout $baseline
          & "$root/bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV

      - name: Configure, build and test
        run: cmake --workflow --preset ${{ matrix.preset }}

  android:
    name: Android (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [android-arm64-debug, android-arm64-release]
    steps:
      - uses: actions/checkout@v5

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install the Android NDK
        run: |
          curl -fsSLo "$RUNNER_TEMP/ndk.zip" \
            "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP"
          echo "ANDROID_NDK_HOME=$RUNNER_TEMP/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Set up vcpkg at the pinned baseline
        run: |
          baseline=$(jq -r '."builtin-baseline"' vcpkg.json)
          root="$RUNNER_TEMP/vcpkg"
          git clone https://github.com/microsoft/vcpkg "$root"
          git -C "$root" checkout "$baseline"
          "$root/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$root" >> "$GITHUB_ENV"

      - name: Configure and build
        run: cmake --workflow --preset ${{ matrix.preset }}
