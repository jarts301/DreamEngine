# The first scene: a crate that spins on a patch of ground, under the sun. Each entity is a table of
# components; "spin" is the game's own, which src/__GAME_NAME__.cpp registers.

[entities.camera.transform]
position = [0.0, 3.5, 8.0]

[entities.camera.camera]
vertical_fov = 45.0
target = [0.0, 0.8, 0.0]

[entities.sun.directional_light]
direction = [-0.5, -1.0, -0.6]
color = [1.0, 0.95, 0.85]
intensity = 1.3
ambient = 0.35

[entities.ground.transform]
scale = [4.0, 1.0, 4.0]

[entities.ground.mesh]
model = "assets:/models/ground.glb"

[entities.crate.transform]
position = [0.0, 1.0, 0.0]
rotation = [0.0, 25.0, 0.0]

[entities.crate.mesh]
model = "assets:/models/crate.glb"

[entities.crate.spin]
speed = 0.8
